# Gera os cards de estatísticas do perfil e commita os SVGs neste repo.
# Substitui a instância pública do github-readme-stats (Vercel), que foi pausada.
#
# Pré-requisito: secret METRICS_TOKEN (PAT classic) com os escopos
#   read:user, public_repo  -> estatísticas públicas
#   repo                    -> necessário para incluir repositórios privados
name: Metrics

on:
  schedule:
    - cron: "17 9 * * *" # diário, ~06:17 BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Card geral (atividade e repositórios)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.general.svg
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          repositories_affiliations: owner
          committer_message: "chore(metrics): atualiza card geral [skip ci]"

      - name: Card de linguagens
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          config_timezone: America/Sao_Paulo
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, dockerfile, makefile
          committer_message: "chore(metrics): atualiza card de linguagens [skip ci]"
